plugins {
    id "com.android.application"
}

android {
    namespace "com.imdacode.bharatfreetv"
    compileSdk 35

    defaultConfig {
        applicationId "com.imdacode.bharatfreetv"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir("generated/assets")
    }
}

def syncPlaylist = tasks.register("syncPlaylist", Copy) {
    from rootProject.file("playlist.m3u")
    into layout.buildDirectory.dir("generated/assets")
}

tasks.named("preBuild").configure {
    dependsOn syncPlaylist
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"

    testImplementation "junit:junit:4.13.2"
}
